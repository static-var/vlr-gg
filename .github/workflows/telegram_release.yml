name: Telegram Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VLR_AUTH_TOKEN: ${{ secrets.API_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        run: python3 scripts/read-release-version.py >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.20+101'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0'

      - name: Decode keystore
        env:
          ENCODED_STRING: ${{ secrets.SIGNING_KEY }}
        run: |
          umask 077
          signing_store="$RUNNER_TEMP/vlr-release.jks"
          echo "VLR_SIGNING_STORE_FILE=$signing_store" >> "$GITHUB_ENV"
          printf '%s' "$ENCODED_STRING" | base64 --decode > "$signing_store"

      - name: Build release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleRelease \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -PsentryUpload=true \
            --stacktrace

      - name: Locate release artifact
        run: |
          artifact="androidApp/build/outputs/apk/release/androidApp-release.apk"
          test -s "$artifact"
          echo "APK=$artifact" >> "$GITHUB_ENV"

      - name: Send Telegram release
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.CHAT_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          document: ${{ env.APK }}
          message: |
            This is a test build, please ignore or install at your own risk.

      - name: Remove signing file
        if: always()
        run: rm -f "$VLR_SIGNING_STORE_FILE"
