name: Internal Play store release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name
        required: true
        type: string
      version_code:
        description: Android version code (must exceed the last published version)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      VLR_AUTH_TOKEN: ${{ secrets.API_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37'

      - name: Decode keystore
        env:
          ENCODED_STRING: ${{ secrets.SIGNING_KEY }}
        run: |
          umask 077
          signing_store="$RUNNER_TEMP/vlr-release.jks"
          echo "VLR_SIGNING_STORE_FILE=$signing_store" >> "$GITHUB_ENV"
          printf '%s' "$ENCODED_STRING" | base64 --decode > "$signing_store"

      - name: Build release
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:bundleRelease \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -PreleaseVersionName="$VERSION_NAME" \
            -PreleaseVersionCode="$VERSION_CODE" \
            --stacktrace

      - name: Locate release artifact
        run: |
          artifact="androidApp/build/outputs/bundle/release/androidApp-release.aab"
          test -s "$artifact"
          echo "APK=$artifact" >> "$GITHUB_ENV"

      - name: Publish to Play Store
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: dev.staticvar.vlr
          releaseFiles: ${{ env.APK }}
          track: beta
          inAppUpdatePriority: 5
          whatsNewDirectory: distribution/whatsnew

      - name: Push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ env.VERSION_NAME }}
          tag_prefix: ''
          default_prerelease_bump: false

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          artifacts: ${{ env.APK }}

      - name: Send Telegram release
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.CHAT_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          document: ${{ env.APK }}
          message: |
            Published ${{ env.VERSION_NAME }}
            Release available at https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag_version.outputs.new_tag }}
            Early access app update released, should reflect on Play Store soon.

      - name: Remove signing file
        if: always()
        run: rm -f "$VLR_SIGNING_STORE_FILE"
