			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -euo pipefail\nUSER_HOME=\"${HOME:-$(eval echo \"~${USER:-}\")}\"\n\nexport REPO_ROOT=\"$SRCROOT/..\"\nexport GENERATED_SWIFT_PATH=\"$SRCROOT/iosApp/GeneratedBuildConfig.swift\"\n\nif ! java -version >/dev/null 2>&1; then\n  if [ -n \"$USER_HOME\" ] && [ -x \"$USER_HOME/.sdkman/candidates/java/current/bin/java\" ]; then\n    export JAVA_HOME=\"$USER_HOME/.sdkman/candidates/java/current\"\n    export PATH=\"$JAVA_HOME/bin:$PATH\"\n  elif [ -x /usr/libexec/java_home ]; then\n    JAVA_HOME=\"$(/usr/libexec/java_home 2>/dev/null || true)\"\n    if [ -n \"$JAVA_HOME\" ] && [ -x \"$JAVA_HOME/bin/java\" ]; then\n      export JAVA_HOME\n      export PATH=\"$JAVA_HOME/bin:$PATH\"\n    fi\n  fi\nfi\n\nif ! java -version >/dev/null 2>&1; then\n  echo \"error: Java runtime not found. Install a JDK or set JAVA_HOME before building iOS.\" >&2\n  exit 1\nfi\n\npython3 <<'PY'\nimport os\nfrom pathlib import Path\n\nrepo_root = Path(os.environ[\"REPO_ROOT\"])\ngenerated_swift_path = Path(os.environ[\"GENERATED_SWIFT_PATH\"])\n\ndef read_property(path: Path, key: str) -> str:\n    if not path.exists():\n        return \"\"\n    for raw_line in path.read_text().splitlines():\n        line = raw_line.strip()\n        if not line or line.startswith(\"#\") or \"=\" not in line:\n            continue\n        current_key, value = line.split(\"=\", 1)\n        if current_key.strip() == key:\n            return value.strip().strip('\"').strip(\"'\")\n    return \"\"\n\ndef normalize_token(value):\n    token = (value or \"\").strip().strip('\"').strip(\"'\")\n    if token == \"replace-with-your-token\":\n        return \"\"\n    return token\n\ntoken = next(\n    (\n        candidate\n        for candidate in (\n            normalize_token(os.environ.get(\"VLR_AUTH_TOKEN\")),\n            normalize_token(read_property(repo_root / \"local.properties\", \"TOKEN\")),\n            normalize_token(read_property(repo_root / \"local.properties\", \"VLR_AUTH_TOKEN\")),\n            normalize_token(read_property(repo_root / \".env\", \"VLR_AUTH_TOKEN\")),\n        )\n        if candidate\n    ),\n    \"\",\n)\n\nescaped_token = token.replace(\"\\\\\", \"\\\\\\\\\").replace('\"', '\\\\\"')\nauth_token_literal = f'\"{escaped_token}\"' if escaped_token else \"nil\"\n\ngenerated_swift_path.parent.mkdir(parents=True, exist_ok=True)\ngenerated_swift_path.write_text(\n    \"enum GeneratedBuildConfig {\\n\"\n    f\"    static let authToken: String? = {auth_token_literal}\\n\"\n    \"}\\n\"\n)\nPY\n\ncd \"$SRCROOT/..\"\n./gradle-safe.sh :shared:embedAndSignAppleFrameworkForXcode\n";
