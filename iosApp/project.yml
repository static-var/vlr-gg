name: iosApp
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    PRODUCT_BUNDLE_IDENTIFIER: dev.staticvar.vlr.ios
    PRODUCT_NAME: VLR
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: iosApp/Info.plist
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    OTHER_LDFLAGS:
      - $(inherited)
      - -framework
      - shared
      - -lsqlite3
    LD_RUNPATH_SEARCH_PATHS:
      - $(inherited)
      - "@executable_path/Frameworks"
      - "@loader_path/Frameworks"

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    exactVersion: 8.58.2

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      - path: WidgetShared
    dependencies:
      - package: Sentry
        product: Sentry
      - target: VLRWidgetExtension
        embed: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
    preBuildScripts:
      - name: Build shared framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          USER_HOME="${HOME:-$(eval echo "~${USER:-}")}"

          export REPO_ROOT="$SRCROOT/.."
          export GENERATED_SWIFT_PATH="$SRCROOT/iosApp/GeneratedBuildConfig.swift"

          if ! java -version >/dev/null 2>&1; then
            if [ -n "$USER_HOME" ] && [ -x "$USER_HOME/.sdkman/candidates/java/current/bin/java" ]; then
              export JAVA_HOME="$USER_HOME/.sdkman/candidates/java/current"
              export PATH="$JAVA_HOME/bin:$PATH"
            elif [ -x /usr/libexec/java_home ]; then
              JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null || true)"
              if [ -n "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/java" ]; then
                export JAVA_HOME
                export PATH="$JAVA_HOME/bin:$PATH"
              fi
            fi
          fi

          if ! java -version >/dev/null 2>&1; then
            echo "error: Java runtime not found. Install a JDK or set JAVA_HOME before building iOS." >&2
            exit 1
          fi

          python3 "$REPO_ROOT/scripts/generate-ios-build-config.py"

          cd "$SRCROOT/.."
          if command -v build-brief >/dev/null 2>&1; then
            build-brief ./gradlew :shared:embedAndSignAppleFrameworkForXcode
          else
            ./gradlew :shared:embedAndSignAppleFrameworkForXcode
          fi

  VLRWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: VLRWidget
      - path: WidgetShared
      - path: ../designsystem/src/commonMain/composeResources/font/space_grotesk_regular.ttf
        buildPhase: resources
      - path: ../designsystem/src/commonMain/composeResources/files/font_licenses/space_grotesk_OFL.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.staticvar.vlr.ios.widget
        PRODUCT_NAME: VLRWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VLRWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: VLRWidget/VLRWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: ""
    preBuildScripts:
      - name: Generate widget build config
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export REPO_ROOT="$SRCROOT/.."
          export GENERATED_SWIFT_PATH="$SRCROOT/VLRWidget/GeneratedBuildConfig.swift"
          python3 "$REPO_ROOT/scripts/generate-ios-build-config.py"

  VLRWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VLRWidgetTests
      - path: VLRWidget/VLRWidgetModels.swift
      - path: VLRWidget/VLRWidgetRefresh.swift
      - path: VLRWidget/UpcomingMatchesWidget.swift
      - path: WidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.staticvar.vlr.ios.widget-tests
        PRODUCT_NAME: VLRWidgetTests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        OTHER_LDFLAGS: ""
        FRAMEWORK_SEARCH_PATHS: ""
        TEST_HOST: ""
        BUNDLE_LOADER: ""
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - VLRWidgetTests
  WidgetRefreshTests:
    build:
      targets:
        VLRWidgetTests: test
    test:
      config: Debug
      targets:
        - VLRWidgetTests
